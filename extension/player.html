<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore finds player</title>
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="stylesheet" href="mini.css">
</head>
<body class="mini">
  <div class="mini-wrap" id="mini-wrap">
    <div class="mini-top">
      <p class="mini-now" id="mini-now">Nothing playing</p>
      <span class="mini-pos" id="mini-pos"></span>
    </div>
    <iframe id="mini-frame" title="Spotify player" allow="autoplay; encrypted-media; clipboard-write; fullscreen; picture-in-picture"></iframe>
    <div class="mini-controls">
      <button id="mini-prev" aria-label="Previous song">Prev</button>
      <button id="mini-next" aria-label="Next song">Next</button>
      <span class="mini-grow"></span>
      <button id="mini-pip" class="linkish" hidden>Keep on top</button>
      <button id="mini-back" class="linkish">Back to panel</button>
    </div>
    <p class="mini-hint" id="mini-hint" role="status"></p>
    <div class="mini-start" id="mini-start" hidden>
      <button class="pill" id="mini-start-btn"><svg class="icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z"/></svg><span>Play</span></button>
      <span>Chrome wants one click in this window before it plays sound.</span>
    </div>
  </div>
  <div class="mini-away" id="mini-away" hidden>
    <p>The controls are in the floating window. The music plays from this one, so keep it open and not minimized.</p>
    <button id="mini-away-btn">Bring the controls back here</button>
  </div>
  <!-- Keep on top: these controls move to the floating window; the music stays in this one. -->
  <div class="float" id="mini-float" hidden>
    <img class="float-art" id="mini-float-art" alt="">
    <div class="float-main">
      <p class="float-title" id="mini-float-title"></p>
      <div class="float-sub">
        <p class="float-artist" id="mini-float-artist"></p>
        <button id="mini-float-back" class="linkish">Back to panel</button>
      </div>
      <div class="float-controls">
        <button id="mini-float-prev" aria-label="Previous song"><svg class="icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1h1.5v8H1zM9 1v8L3 5z"/></svg></button>
        <button class="pill" id="mini-float-play"><svg class="icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z"/></svg><span>Play</span></button>
        <button id="mini-float-next" aria-label="Next song"><svg class="icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M7.5 1H9v8H7.5zM1 1v8l6-4z"/></svg></button>
        <span class="float-time" id="mini-float-time"></span>
      </div>
      <p class="float-hint" id="mini-float-hint"></p>
    </div>
  </div>
  <script type="module" src="mini.js"></script>
</body>
</html>
