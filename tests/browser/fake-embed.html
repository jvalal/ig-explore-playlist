window.addEventListener('message', async (e) => {
  if (!e.data || e.data.command !== 'toggle') return;

    if (window.__FORCE_BLOCK) { parent.postMessage({ type: '__test', blocked: id, reason: 'simulated' }, '*'); upd(); return; }

});
