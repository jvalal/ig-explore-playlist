let playing = false, pos = 0, startedAt = 0, timer = null, ended = false;

const post = (type, payload) => parent.postMessage(payload === undefined ? { type } : { type, payload }, '*');
const now = () => (playing ? Math.min(CFG.durationMs, pos + (Date.now() - startedAt)) : pos);
const upd = (over = {}) => post('playback_update', Object.assign({ isPaused: !playing, isBuffering: false, duration: CFG.durationMs, position: now(), playingURI: uri }, over));
const echo = (o) => parent.postMessage(Object.assign({ type: '__fake', id }, o), '*');

function tick() {
  const p = now();
  if (p >= CFG.durationMs && item < items.length - 1) {
    upd({ isPaused: false, position: CFG.durationMs });
    item++; uri = 'spotify:track:' + items[item]; pos = 0; startedAt = Date.now();
    upd(); post('playback_started', { playingURI: uri });
    echo({ event: 'next-item', uri });
    return;
  }
  if (p >= CFG.durationMs) {
    clearInterval(timer); timer = null;
    upd({ isPaused: false, position: CFG.durationMs });
    pos = CFG.durationMs; playing = false; ended = true; audio.pause();
    if (CFG.mode === 'full') { pos = 0; for (let i = 0; i < 3; i++) setTimeout(() => upd({ isPaused: true, position: 0 }), 4 + i * 40); }
    document.getElementById('s').textContent = 'ended';
    return;
  }
  upd();
}

async function start(fromZero) {
  if (CFG.block) { echo({ event: 'blocked', reason: 'config' }); return; }
  try { await audio.play(); } catch (err) { echo({ event: 'blocked', reason: err.name }); return; }
  if (fromZero || ended) { pos = 0; ended = false; }
  const atZero = pos === 0;
  upd({ isPaused: false, isBuffering: true, duration: 0, position: 0, playingURI: '' });
  playing = true; startedAt = Date.now();
  setTimeout(() => { upd(); if (atZero) post('playback_started', { playingURI: uri }); }, 30);
  clearInterval(timer); timer = setInterval(tick, CFG.tickMs);
  echo({ event: 'started', fromZero: atZero });
  document.getElementById('s').textContent = 'playing';
}

function stop() {
  upd({ isPaused: false });
  pos = now(); playing = false; audio.pause(); clearInterval(timer); timer = null;
  for (let i = 0; i < 3; i++) setTimeout(() => upd(), 10 + i * 50);
  document.getElementById('s').textContent = 'paused';
}

window.addEventListener('message', (e) => {
  if (!e.data || typeof e.data !== 'object' || typeof e.data.command !== 'string') return;
  const c = e.data.command;
  echo({ event: 'cmd', command: c, playing });
  if (c === 'resume') { if (!playing) start(false); }
  else if (c === 'pause') { if (playing) stop(); }
  else if (c === 'play') { if (playing) { pos = 0; startedAt = Date.now(); upd(); } else start(true); }
  else if (c === 'toggle') { if (playing) stop(); else start(false); }
});
window.addEventListener('pagehide', () => { if (playing) upd(); });

if (CFG.readyDelayMs) setTimeout(() => post('ready'), CFG.readyDelayMs); else post('ready');
